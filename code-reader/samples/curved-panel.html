<style>
  body { margin: 0; min-height: 100vh; background: #f4f4f5; font-family: system-ui, sans-serif; color: #0a0a0a; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 64px; z-index: 2; }
  .shape { position: absolute; left: 0; top: 0; height: 100%; width: 400px; overflow: visible; pointer-events: none; filter: drop-shadow(8px 0 24px rgba(0, 0, 0, .1)); }
  .shape path { fill: #fff; }
  .clip { position: absolute; left: 0; top: 0; bottom: 0; width: 64px; overflow: hidden; }
  .inner { width: 280px; height: 100%; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .t { white-space: nowrap; opacity: 0; }
  .head { position: relative; display: flex; align-items: center; gap: 10px; height: 40px; margin-bottom: 8px; padding-left: 6px; width: max(40px, calc(var(--w, 64px) - 24px)); box-sizing: border-box; }
  /* The toggle rides the right edge: at icon width it sits in the rail, when open it sits at the far right. */
  .toggle { position: absolute; right: 0; top: 0; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: none; color: #52525b; cursor: pointer; }
  .toggle:hover { background: #f4f4f5; color: #0a0a0a; }
  .toggle:focus-visible, .item:focus-visible { outline: 2px solid #0a0a0a; outline-offset: -2px; }
  .logo { width: 28px; height: 28px; flex: none; border-radius: 6px; background: #0a0a0a; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .head strong { flex: 1; min-width: 0; font-size: 15px; }
  .item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 11px; box-sizing: border-box; overflow: hidden; width: max(40px, calc(var(--w, 64px) - 24px)); border-radius: 8px; color: #3f3f46; text-decoration: none; }
  .item:hover { background: #f4f4f5; color: #0a0a0a; }
  .item.active { background: #f4f4f5; color: #0a0a0a; font-weight: 500; }
  .count { margin-left: auto; font-size: 12px; color: #a1a1aa; }
  .dot { width: 8px; height: 8px; margin: 0 5px; flex: none; border-radius: 2px; background: #a1a1aa; }
  .label { height: 28px; padding: 12px 11px 0; font-size: 12px; color: #a1a1aa; }
  .user { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 6px; }
  .avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; background: #e4e4e7; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
  .user small { display: block; color: #71717a; }
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  const bar = document.querySelector('.sidebar');
  const clip = bar.querySelector('.clip');
  const path = bar.querySelector('.shape path');
  const toggle = bar.querySelector('.toggle');
  const texts = bar.querySelectorAll('.t');
  const MIN = 64, MAX = 280;            // icon-only width, full width
  const s = { w: MIN, bulge: 0 };       // current width, and how far the right edge curves out (px)
  let expanded = false, tl;

  // The right edge is one smooth curve from top to bottom; bulge 0 makes it straight.
  function draw() {
    const h = bar.clientHeight;
    path.setAttribute('d', `M0 0 H${s.w} Q${s.w + s.bulge} ${h / 2} ${s.w} ${h} H0 Z`);
    clip.style.width = s.w + 'px';
    clip.style.setProperty('--w', s.w + 'px');   // items follow the width, so highlights stay inside
  }
  draw();
  window.addEventListener('resize', draw);

  function expand() {
    tl?.kill();
    tl = gsap.timeline({ onUpdate: draw })
      .to(s, { w: MAX, duration: 0.55, ease: 'power3.out' }, 0)
      .to(s, { bulge: 56, duration: 0.3, ease: 'power2.out' }, 0)            // the edge bows out as it travels
      .to(s, { bulge: 0, duration: 0.7, ease: 'elastic.out(1, 0.35)' }, 0.3)  // then settles straight with a small bounce
      .to(texts, { opacity: 1, duration: 0.25, stagger: 0.015 }, 0.25);
  }
  function collapse() {
    tl?.kill();
    tl = gsap.timeline({ onUpdate: draw })
      .to(texts, { opacity: 0, duration: 0.12 }, 0)
      .to(s, { bulge: -32, duration: 0.2, ease: 'power2.out' }, 0)           // the edge trails behind as it closes
      .to(s, { w: MIN, duration: 0.45, ease: 'power3.inOut' }, 0.05)
      .to(s, { bulge: 0, duration: 0.5, ease: 'elastic.out(1, 0.4)' }, 0.35); // and settles straight at icon width
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) gsap.globalTimeline.timeScale(20);
  function set(open) {
    expanded = open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Collapse sidebar' : 'Expand sidebar');
    open ? expand() : collapse();
  }
  toggle.addEventListener('click', () => set(!expanded));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && expanded) set(false); });
</script>
