<style>
  body { margin: 0; min-height: 100vh; background: #f4f4f5; font-family: system-ui, sans-serif; color: #0a0a0a; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .tab {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 1;
    display: grid; place-items: center; width: 40px; height: 48px; padding: 0;
    border: 1px solid #d4d4d8; border-left: 0; border-radius: 0 8px 8px 0; background: #fff; color: #0a0a0a; cursor: pointer;
  }
  .tab:focus-visible, .toggle:focus-visible { outline: 2px solid #0a0a0a; outline-offset: 2px; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 2; pointer-events: none; visibility: hidden; }
  .sidebar.open { pointer-events: auto; }
  .shape { position: absolute; left: 0; top: 0; height: 100%; width: calc(100% + 120px); overflow: visible; filter: drop-shadow(8px 0 24px rgba(0, 0, 0, .12)); }
  .shape path { fill: #fff; }
  .inner { position: relative; height: 100%; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 4px; opacity: 0; font-size: 14px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 4px 4px 12px; }
  .logo { width: 28px; height: 28px; border-radius: 6px; background: #0a0a0a; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .head strong { flex: 1; font-size: 15px; }
  .toggle { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: none; color: #52525b; cursor: pointer; }
  .toggle:hover { background: #f4f4f5; color: #0a0a0a; }
  .search { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 10px; border: 1px solid #e4e4e7; border-radius: 8px; color: #71717a; }
  .search kbd { margin-left: auto; font: 12px system-ui, sans-serif; color: #a1a1aa; }
  .label { padding: 16px 10px 6px; font-size: 12px; color: #a1a1aa; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #3f3f46; text-decoration: none; }
  .item:hover { background: #f4f4f5; color: #0a0a0a; }
  .item.active { background: #f4f4f5; color: #0a0a0a; font-weight: 500; }
  .count { margin-left: auto; font-size: 12px; color: #a1a1aa; }
  .dot { width: 8px; height: 8px; margin: 0 5px; border-radius: 2px; background: #a1a1aa; }
  .user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid #f4f4f5; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #e4e4e7; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .user small { display: block; color: #71717a; }
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  const tab = document.querySelector('.tab');
  const bar = document.querySelector('.sidebar');
  const path = bar.querySelector('.shape path');
  const inner = bar.querySelector('.inner');
  const W = 280;                       // open width
  const s = { w: 0, bulge: 0 };        // current width, and how far the right edge curves out (px)

  // The right edge is one smooth curve from top to bottom; bulge 0 makes it straight.
  function draw() {
    const h = bar.clientHeight;
    path.setAttribute('d', `M0 0 H${s.w} Q${s.w + s.bulge} ${h / 2} ${s.w} ${h} H0 Z`);
  }
  draw();
  window.addEventListener('resize', draw);

  let tl;
  function open() {
    tl?.kill();
    bar.classList.add('open');
    tab.setAttribute('aria-expanded', 'true');
    gsap.set(bar, { visibility: 'visible' });
    tl = gsap.timeline({ onUpdate: draw })
      .to(s, { w: W, duration: 0.55, ease: 'power3.out' }, 0)
      .to(s, { bulge: 56, duration: 0.3, ease: 'power2.out' }, 0)            // the edge bows out as it travels
      .to(s, { bulge: 0, duration: 0.7, ease: 'elastic.out(1, 0.35)' }, 0.3)  // then settles straight with a small bounce
      .to(inner, { opacity: 1, duration: 0.25 }, 0.35);
  }
  function close() {
    tl?.kill();
    bar.classList.remove('open');
    tab.setAttribute('aria-expanded', 'false');
    tl = gsap.timeline({ onUpdate: draw, onComplete: () => gsap.set(bar, { visibility: 'hidden' }) })
      .to(inner, { opacity: 0, duration: 0.15 }, 0)
      .to(s, { bulge: -36, duration: 0.2, ease: 'power2.out' }, 0)           // the edge trails behind as it closes
      .to(s, { w: 0, bulge: 0, duration: 0.4, ease: 'power3.in' }, 0.1);
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) gsap.globalTimeline.timeScale(20);
  tab.addEventListener('click', () => (bar.classList.contains('open') ? close() : open()));
  bar.querySelector('.toggle').addEventListener('click', close);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && bar.classList.contains('open')) close(); });
</script>
