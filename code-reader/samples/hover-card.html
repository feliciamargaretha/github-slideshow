<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f0f0f0;
    font-family: system-ui, sans-serif;
  }
  .card {
    width: 280px;
    padding: 24px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    transition: transform 240ms ease-out, box-shadow 240ms ease-out;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 20px;
    line-height: 28px;
  }
  .card p {
    margin: 0;
    color: #525252;
    line-height: 24px;
  }
</style>

<div class="card">
  <h3>Hover me</h3>
  <p>The card lifts and its shadow grows when the mouse is over it.</p>
</div>
