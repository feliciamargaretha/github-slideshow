<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Letterforms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Major+Mono+Display&display=swap">
<style>
  /* Layout: one full-screen stage; the object sits in a 40×24 type grid above a typewriter-style input line. */
  :root {
    --bg: #ECEEF1;
    --ink: #14171C;
    --ink-soft: #5A6170;
    --grid: #D2D6DD;
    --line: #C6CBD4;
    --accent: #2F45C9;
    --font-display: "Major Mono Display", "JetBrains Mono", ui-monospace, monospace;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1013; --ink: #ECE9E2; --ink-soft: #8C93A3; --grid: #22262E; --line: #2C313B; --accent: #98A6FF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1013; --ink: #ECE9E2; --ink-soft: #8C93A3; --grid: #22262E; --line: #2C313B; --accent: #98A6FF;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-mono);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .top {
    position: fixed; left: 0; right: 0;
    top: env(safe-area-inset-top, 0px);
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 18px 20px;
    pointer-events: none;
  }
  .brand { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.02em; }
  .spec { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }

  .dock {
    position: fixed; left: 0; right: 0;
    bottom: 0;
    padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
  }
  .dock-inner { width: 100%; max-width: 560px; display: grid; gap: 12px; }
  .status { font-size: 12px; color: var(--ink-soft); min-height: 1.4em; }
  .status b { color: var(--ink); font-weight: 700; }
  .status b.now { color: var(--accent); }
  .status .note { opacity: 0.85; }

  form.line {
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1.5px solid var(--line);
    padding-bottom: 8px;
  }
  form.line:focus-within { border-bottom-color: var(--accent); }
  .prompt { color: var(--accent); font-size: 20px; font-weight: 700; }
  #word {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--ink); caret-color: var(--accent);
    font: 400 20px/1.3 var(--font-mono);
    letter-spacing: 0.04em;
  }
  #word::placeholder { color: var(--ink-soft); opacity: 0.7; }
  .hint { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }


  .rows { display: grid; gap: 8px; }
  .row { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .row-label {
    flex: 0 0 4.5em;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); opacity: 0.8;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 14px; min-width: 0; }
  .chips button {
    background: none; border: 0; padding: 2px 0; cursor: pointer;
    font: 400 13px var(--font-mono); color: var(--ink-soft);
    border-bottom: 1px dashed transparent;
  }
  .chips button:hover { color: var(--ink); border-bottom-color: var(--line); }
  .chips button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .chips button:focus-visible, #word:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 480px) {
    .hint { display: none; }
    #word, .prompt { font-size: 18px; }
    .row-label { flex-basis: 3.8em; }
  }
</style>

<canvas id="stage" aria-hidden="true"></canvas>

<header class="top">
  <div class="brand">letterforms</div>
  <div class="spec" id="spec">40 × 24 cells</div>
</header>

<div class="dock">
  <div class="dock-inner">
    <div class="status" id="status" aria-live="polite"></div>
    <form class="line" id="form" autocomplete="off">
      <label class="sr" for="word">Describe a scene, like “a man walks, then runs” or “a cat chases a bird”</label>
      <span class="prompt" aria-hidden="true">›</span>
      <input id="word" name="word" type="text" maxlength="90" spellcheck="false" autocapitalize="off" placeholder="a man walks, then runs…">
      <span class="hint">enter ↵</span>
    </form>
    <div class="rows">
      <div class="row"><span class="row-label" id="things-label">things</span><div class="chips" id="chips" role="group" aria-labelledby="things-label"></div></div>
      <div class="row"><span class="row-label" id="verbs-label">actions</span><div class="chips" id="verbs" role="group" aria-labelledby="verbs-label"></div></div>
      <div class="row"><span class="row-label" id="examples-label">scenes</span><div class="chips" id="examples" role="group" aria-labelledby="examples-label"></div></div>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 80, ROWS = 24;          // type grid the stage is set in (each actor's box is 40 × 24)
  const SX = 6, SY = 10;               // mask pixels per cell (matches 0.6 monospace aspect)
  const BOX = 0.24;                    // object height as a share of the screen
  const TAU = Math.PI * 2, PI = Math.PI, S = Math.sin, C = Math.cos;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = v => { v = clamp(v); return v * v * (3 - 2 * v); };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- drawing helpers (each actor draws in a 100×100 unit box; the stage is 200×100) ----------
  const line = (c, x1, y1, x2, y2, w) => { c.lineWidth = w; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
  const circle = (c, x, y, r) => { if (r <= 0) return; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  const ellipse = (c, x, y, rx, ry, rot = 0) => { if (rx <= 0 || ry <= 0) return; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fill(); };
  const poly = (c, p) => { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); c.fill(); };
  const hole = (c, fn) => { c.save(); c.globalCompositeOperation = "destination-out"; fn(); c.restore(); };

  // Floating "Z"s for anything asleep.
  function zzz(c, t, x, y) {
    for (let i = 0; i < 3; i++) {
      const ph = (t * 0.35 + i / 3) % 1, s = 5 + ph * 7, zx = x + ph * 16, zy = y - ph * 30;
      c.lineWidth = 3.2; c.beginPath();
      c.moveTo(zx, zy); c.lineTo(zx + s, zy); c.lineTo(zx, zy + s * 1.2); c.lineTo(zx + s, zy + s * 1.2); c.stroke();
    }
  }
  // Short dashes trailing behind anything fast.
  function speedLines(c, t, x0, ys) {
    ys.forEach((y, i) => { const off = (t * 2.6 + i * 0.37) % 1; line(c, x0 - off * 18, y, x0 - off * 18 + 9, y, 3); });
  }

  // A stick figure facing right. Angles are measured from straight down; positive swings forward.
  // rot/dy tip the whole figure over (used for lying down), so every pose can blend into every other.
  function figure(c, P) {
    c.save();
    if (P.rot || P.dy) { c.translate(0, P.dy || 0); c.translate(50, 50); c.rotate(P.rot || 0); c.translate(-50, -50); }
    const x = P.x ?? 50, y = P.y ?? 54, L = P.lean || 0, ux = S(L), uy = -C(L);
    const sx = x + ux * 25, sy = y + uy * 25;
    circle(c, x + ux * 40 + (P.headX || 0), y + uy * 40 + (P.headY || 0), 8.5);
    line(c, x, y, x + ux * 27, y + uy * 27, 9);
    const limb = (bx, by, a1, l1, a2, l2, w1, w2, foot) => {
      const kx = bx + S(a1) * l1, ky = by + C(a1) * l1, fx = kx + S(a2) * l2, fy = ky + C(a2) * l2;
      line(c, bx, by, kx, ky, w1); line(c, kx, ky, fx, fy, w2);
      if (foot) line(c, fx, fy, fx + C(a2) * 6, fy - S(a2) * 6, 6);
    };
    for (const [a1, a2] of P.legs) limb(x, y, a1, 20, a2, 19, 8, 7, true);
    for (const [a1, a2] of P.arms) limb(sx, sy, a1, 14, a2, 13, 7, 6, false);
    c.restore();
  }

  // Blend two poses: every number (and every joint angle) moves part of the way from a to b.
  const POSE_DEFAULTS = { x: 50, y: 54 };
  function lerpPose(a, b, k) {
    const out = {};
    for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) {
      const va = a[key] ?? POSE_DEFAULTS[key] ?? 0, vb = b[key] ?? POSE_DEFAULTS[key] ?? 0;
      out[key] = Array.isArray(va) ? va.map((row, i) => row.map((v, j) => v + (vb[i][j] - v) * k)) : va + (vb - va) * k;
    }
    return out;
  }

  function flyingBird(c, w) {
    poly(c, [32, 54, 12, 45, 15, 63]);
    ellipse(c, 48, 55, 20, 11, -0.15);
    circle(c, 68, 46, 8.5);
    poly(c, [75, 42, 88, 47, 75, 51]);
    hole(c, () => circle(c, 70, 44, 2.3));
    c.beginPath(); c.moveTo(38, 52);
    c.quadraticCurveTo(34, 52 - w * 20, 28, 52 - w * 38);
    c.lineTo(46, 52 - w * 26);
    c.quadraticCurveTo(55, 52 - w * 12, 58, 52);
    c.closePath(); c.fill();
  }
  function perchedBird(c, t, dy, legLen) {
    const peck = Math.pow(Math.max(0, S(t * TAU * 0.45)), 10);
    c.save(); c.translate(50, 62 + dy); c.rotate(-0.35);
    ellipse(c, 0, 0, 17, 11);
    poly(c, [-12, 4, -32, 14, -27, 1]);
    c.restore();
    const hx = 63 + peck * 5, hy = 46 + dy + peck * 7;
    circle(c, hx, hy, 8);
    poly(c, [hx + 6, hy - 3, hx + 16, hy + 1 + peck * 3, hx + 6, hy + 4]);
    hole(c, () => circle(c, hx + 2, hy - 2, 2.2));
    line(c, 46, 72 + dy, 44, 72 + dy + legLen, 2.8); line(c, 53, 72 + dy, 55, 72 + dy + legLen, 2.8);
  }

  function fishBody(c, sw) {
    ellipse(c, 0, 0, 26, 14);
    c.save(); c.translate(-22, 0); c.rotate(sw * 0.45); poly(c, [0, 0, -18, -15, -13, 0, -18, 15]); c.restore();
    poly(c, [-4, -12, 6, -23, 12, -10]);
    poly(c, [0, 10, 8, 19, 10, 9]);
    hole(c, () => circle(c, 15, -3, 2.8));
    hole(c, () => { c.lineWidth = 2.8; c.beginPath(); c.moveTo(6, -11); c.quadraticCurveTo(1, 0, 6, 11); c.stroke(); });
  }

  function catSide(c, p, P) {
    c.save();
    c.translate(0, -Math.abs(S(p)) * P.lift);
    c.lineWidth = 6; c.beginPath(); c.moveTo(28, 54);
    c.bezierCurveTo(18, 50, 14 + S(p) * 3, 34, 20 + S(p) * 6, 24); c.stroke();
    ellipse(c, 48, 56, 22 * P.stretch, 10);
    line(c, 64, 50, 72, 46, 10);
    circle(c, 74, 44, 10);
    poly(c, [66, 39, 67, 26, 75, 35]); poly(c, [75, 35, 83, 26, 83, 39]);
    hole(c, () => circle(c, 78, 43, 2.3));
    const leg = (bx, ph) => {
      const a = S(ph) * P.swing, b = a - Math.max(0, C(ph)) * 0.9;
      const kx = bx + S(a) * 12, ky = 60 + C(a) * 12;
      line(c, bx, 60, kx, ky, 6); line(c, kx, ky, kx + S(b) * 12, ky + C(b) * 12, 5);
    };
    const front = 48 + 15 * P.stretch, back = 48 - 15 * P.stretch;
    leg(front, p + PI); leg(back, p); leg(front, p); leg(back, p + PI);
    c.restore();
  }

  // Rigs: shapes whose actions share a skeleton, so switching action blends the pose instead of cutting.
  const RIGS = {
    figure: (c, P) => figure(c, P),
    cat: (c, P, phase) => catSide(c, phase, P),
  };

  function heartPath(c) {
    c.beginPath(); c.moveTo(0, 32);
    c.bezierCurveTo(-46, 4, -30, -36, 0, -14);
    c.bezierCurveTo(30, -36, 46, 4, 0, 32);
  }

  function sunDisc(c, t, x, y, s) {
    c.save(); c.translate(x, y); c.scale(s, s);
    circle(c, 0, 0, 17);
    for (let i = 0; i < 12; i++) {
      const a = t * 0.5 + i * TAU / 12, L = 8 + (i % 2 ? 0 : 5) + S(t * 3 + i) * 2;
      line(c, C(a) * 24, S(a) * 24, C(a) * (26 + L), S(a) * (26 + L), 5.5);
    }
    hole(c, () => {
      ellipse(c, -6, -4, 2.6, 3.4); ellipse(c, 6, -4, 2.6, 3.4);
      c.lineWidth = 2.8; c.beginPath(); c.arc(0, 1, 7, 0.2 * PI, 0.8 * PI); c.stroke();
    });
    c.restore();
  }

  // ---------- the objects, and the things they can do ----------
  // verbs: canonical verb → action key. default: the action used when no verb (or an unknown one) is typed.
  const SHAPES = {
    man: {
      size: 1, name: "figure", default: "stand",
      verbs: {
        stand: "stand", stop: "stand", walk: "walk", run: "run", jump: "jump", dance: "dance", wave: "wave", sit: "sit", sleep: "sleep",
        chase: "run", flee: "run", crouch: "crouch", fall: "fall", kick: "kick", clap: "clap", point: "point", stretch: "stretch",
        think: "think", laugh: "laugh", look: "look", slither: "crawl",
      },
      // pose(p, t): p is the actor's running gait phase (shared across actions so strides carry over), t is seconds in this action.
      actions: {
        stand: { verb: "stands", label: "standing", rig: "figure", pose: (p, t) => (
          { y: 54 + S(t * 1.6) * 0.6, headY: S(t * 1.6) * 0.6, legs: [[0.22, 0.16], [-0.22, -0.16]], arms: [[0.45, 0.3], [-0.42, -0.28]] }) },
        walk: { verb: "walks", label: "walking", speed: 16, freq: 1.1, rig: "figure", pose: p => {
          const leg = ph => { const a = S(ph) * 0.55; return [a, a - 0.1 - Math.max(0, C(ph)) * 0.9]; };
          const arm = ph => { const a = -S(ph) * 0.6; return [a, a + 0.6]; };
          return { y: 54 - Math.abs(S(p)) * 2.5, legs: [leg(p), leg(p + PI)], arms: [arm(p), arm(p + PI)] };
        }},
        run: { verb: "runs", label: "running", speed: 42, freq: 1.6, rig: "figure", pose: p => {
          const leg = ph => { const a = S(ph) * 0.85 + 0.15; return [a, a - 0.3 - Math.max(0, C(ph)) * 1.6]; };
          const arm = ph => { const a = -S(ph) * 0.9 + 0.2; return [a, a + 1.6]; };
          return { x: 54, y: 55 - Math.abs(S(p)) * 5, lean: 0.3, legs: [leg(p), leg(p + PI)], arms: [arm(p), arm(p + PI)] };
        }, extra(c, t, w) { if (w > 0.5) speedLines(c, t, 22, [34, 50, 66]); } },
        jump: { verb: "jumps", label: "jumping", speed: 18, rig: "figure", pose: (p, t) => {
          const ph = (t % 1.3) / 1.3;
          const h = ph > 0.3 && ph < 0.85 ? S((ph - 0.3) / 0.55 * PI) : 0;
          const cr = ph < 0.3 ? S(ph / 0.3 * PI) : ph >= 0.85 ? S((ph - 0.85) / 0.15 * PI) * 0.8 : 0;
          const th = 0.1 + cr * 0.8 + h * 0.8, sh = -0.1 - cr * 0.4 - h * 0.9, arm = -0.1 - cr * 0.9 + h * 2.7;
          return { y: 56 + cr * 9 - h * 26, lean: cr * 0.35, legs: [[th, sh], [th - 0.12, sh - 0.1]], arms: [[arm, arm + 0.3], [arm - 0.2, arm + 0.1]] };
        }, extra(c, t) { const ph = (t % 1.3) / 1.3, h = ph > 0.3 && ph < 0.85 ? S((ph - 0.3) / 0.55 * PI) : 0, w = (1 - h) * 10 + 5; c.fillRect(50 - w, 95, w * 2, 3.5); } },
        dance: { verb: "dances", label: "dancing", rig: "figure", pose: (p, t) => {
          const q = t * TAU * 1.0, s = S(q), s2 = S(q * 2);
          return {
            x: 50 + s * 4, y: 56 - Math.abs(s2) * 3, lean: s * 0.12,
            legs: [[0.35 + s * 0.25, 0.35 + s * 0.25 - 0.35 * Math.abs(C(q))], [-0.35 + s * 0.25, -0.55 + s * 0.25]],
            arms: [[2.5 + s2 * 0.4, 2.9 + 0.4 * S(q * 2 + 1)], [-2.5 + s2 * 0.4, -2.9 - 0.4 * S(q * 2 + 1)]],
          };
        }},
        wave: { verb: "waves", label: "waving", rig: "figure", pose: (p, t) => (
          { x: 46, y: 54 + S(t * 1.6) * 0.6, headX: 1, legs: [[0.22, 0.16], [-0.22, -0.16]], arms: [[-0.42, -0.28], [1.55, 2.6 + S(t * TAU * 2.2) * 0.6]] }) },
        sit: { verb: "sits", label: "sitting", rig: "figure", pose: (p, t) => (
          { x: 44, y: 72 + S(t * 1.6) * 0.5, lean: -0.05, headY: S(t * 1.2) * 0.8, legs: [[1.5, 0.05], [1.42, 0.12]], arms: [[0.6, 1.3], [0.5, 1.2]] }),
          extra(c, t, w) { if (w > 0.5) { c.fillRect(28, 73, 28, 5); line(c, 32, 76, 32, 96, 4); line(c, 52, 76, 52, 96, 4); } } },
        crouch: { verb: "crouches", label: "crouching", rig: "figure", pose: (p, t) => (
          { y: 66 + S(t * 1.6) * 0.5, lean: 0.35, legs: [[1.0, -0.6], [0.85, -0.75]], arms: [[0.9, 1.4], [0.7, 1.3]] }) },
        fall: { verb: "falls", label: "fallen flat", rig: "figure", pose: (p, t) => (
          { y: 54 + S(t * 1.2) * 0.4, rot: PI / 2, dy: 40, legs: [[0.1, 0.1], [-0.05, 0]], arms: [[2.6, 2.8], [2.4, 2.6]] }) },
        kick: { verb: "kicks", label: "kicking", rig: "figure", pose: (p, t) => {
          const k = Math.pow(Math.max(0, S(t * TAU * 0.8)), 2), th = 0.2 + k * 1.3;
          return { y: 54, lean: -k * 0.15, legs: [[th, th - (1 - k) * 0.6], [-0.15, -0.1]], arms: [[-0.2 - k * 0.6, -0.3], [0.6, 0.9]] };
        }},
        clap: { verb: "claps", label: "clapping", rig: "figure", pose: (p, t) => {
          const q = Math.abs(S(t * TAU * 1.5));
          return { y: 54 - q * 0.8, legs: [[0.22, 0.16], [-0.22, -0.16]], arms: [[1.2, 1.9 + 0.4 * q], [1.2, 1.9 - 0.4 * q]] };
        }},
        point: { verb: "points", label: "pointing", rig: "figure", pose: (p, t) => (
          { y: 54 + S(t * 1.6) * 0.5, headX: 1.5, legs: [[0.22, 0.16], [-0.22, -0.16]], arms: [[1.57 + S(t * 2) * 0.05, 1.57], [-0.3, -0.2]] }) },
        stretch: { verb: "stretches", label: "stretching", rig: "figure", pose: (p, t) => {
          const s = S(t * 1.5);
          return { y: 52 - Math.abs(s), lean: s * 0.08, legs: [[0.2, 0.14], [-0.2, -0.14]], arms: [[2.9 + s * 0.1, 3.05], [-2.9 + s * 0.1, -3.05]] };
        }},
        think: { verb: "thinks", label: "thinking", rig: "figure", pose: (p, t) => (
          { y: 54, headY: S(t * 0.8) * 0.6, headX: -0.5, legs: [[0.15, 0.1], [-0.2, -0.14]], arms: [[0.5, 3.0], [-0.2, 0.6]] }),
          extra(c, t) { c.lineWidth = 3; c.beginPath(); c.arc(68, 8 + S(t * 2) * 1.5, 4, PI, 0.4 * PI); c.stroke(); circle(c, 68, 19 + S(t * 2) * 1.5, 1.8); } },
        laugh: { verb: "laughs", label: "laughing", rig: "figure", pose: (p, t) => (
          { y: 54 + Math.abs(S(t * TAU * 4)) * 1.5, lean: -0.15, headY: -Math.abs(S(t * TAU * 4)) * 1.2, legs: [[0.22, 0.16], [-0.22, -0.16]], arms: [[0.6, 1.6], [0.5, 1.5]] }) },
        look: { verb: "looks", label: "looking around", rig: "figure", pose: (p, t) => (
          { y: 54, headX: S(t * 0.9) * 2, lean: S(t * 0.9) * 0.05, legs: [[0.22, 0.16], [-0.22, -0.16]], arms: [[1.3, 2.75], [-0.3, -0.2]] }) },
        crawl: { verb: "crawls", label: "crawling", speed: 6, freq: 0.9, rig: "figure", pose: p => {
          const s = S(p) * 0.25;
          return { x: 36, y: 76, lean: 1.4, legs: [[s, -1.57 + s], [-s, -1.57 - s]], arms: [[-s, -s], [s, s]] };
        }},
        sleep: { verb: "sleeps", label: "sleeping", rig: "figure", pose: (p, t) => (

    }
    return order.length ? { steps, order, nounWords, notes, hasVerb } : null;
  }

  // Fallback: spell the word itself, in its own letters, with a wave.
  function drawWord(c, t, word) {
    c.font = '700 100px "JetBrains Mono", monospace';
    const w100 = c.measureText(word).width || 1;
    const fs = Math.min(40, 150 / (w100 / 100));
    c.font = `700 ${fs}px "JetBrains Mono", monospace`;
    c.textBaseline = "middle";
    // Cells are taller than wide, so stretch the type vertically to give each glyph enough rows.
    c.translate(0, 50); c.scale(1, 2.4); c.translate(0, -50);
    const cw = c.measureText(word).width / word.length, x0 = 100 - (cw * word.length) / 2;
    [...word].forEach((ch, i) => c.fillText(ch, x0 + i * cw, 50 + S(t * 3 - i * 0.7) * 3));
  }

  // ---------- canvases ----------
  const STAGE_W = 200, GROUND = 97;          // stage units; actors stand on GROUND
  const LIMIT_R = 150, LIMIT_L = 40;         // movers stay between these; past LIMIT_R the ground scrolls instead
  const STEP_SECONDS = 3.6, HOLD_SECONDS = 1.6;
  const BLEND_SECONDS = 0.8;
  const OUTLINE_BELOW = 0.5;                 // drawn smaller than this, a thing switches to an outline of letters                 // how long one action takes to turn into the next
  const GAP_EVERY = 34, GAP = 5;             // ground texture: a 2-cell gap every 34 units
  const stage = document.getElementById("stage");
  const ctx = stage.getContext("2d");
  const makeLayer = () => {
    const cv = document.createElement("canvas");
    cv.width = COLS * SX; cv.height = ROWS * SY;
    return { cv, c: cv.getContext("2d", { willReadFrequently: true }), cov: new Float32Array(COLS * ROWS) };
  };
  const layers = Array.from({ length: MAX_ACTORS }, makeLayer);
  const ghosts = Array.from({ length: MAX_ACTORS }, makeLayer);   // the outgoing action, while it dissolves into the new one
  const UNIT = layers[0].cv.width / STAGE_W;   // mask pixels per stage unit (same on both axes)

  let W = 0, H = 0, fs = 10, cellW = 6, ox = 0, oy = 0;
  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fs = Math.max(150, H * BOX) / ROWS;
    ctx.font = `400 ${fs}px "JetBrains Mono", monospace`;
    cellW = ctx.measureText("M").width || fs * 0.6;
    const maxW = W - 32;
    if (cellW * COLS > maxW) { const k = maxW / (cellW * COLS); fs *= k; cellW *= k; }
    ox = Math.round((W - cellW * COLS) / 2);
    oy = Math.max(64, Math.round(H * 0.38 - (fs * ROWS) / 2));
  }

  // ---------- colors from tokens ----------
  let colors = {}, colorsAt = -1;
  function readColors(now) {
    if (now - colorsAt < 500) return;
    const cs = getComputedStyle(document.documentElement);
    colors = { ink: cs.getPropertyValue("--ink").trim(), soft: cs.getPropertyValue("--ink-soft").trim(), grid: cs.getPropertyValue("--grid").trim() };
    colorsAt = now;
  }

  // ---------- state ----------
  const statusEl = document.getElementById("status");
  const input = document.getElementById("word");
  const chipsEl = document.getElementById("chips");
  const verbsEl = document.getElementById("verbs");
  const examplesEl = document.getElementById("examples");
  const specEl = document.getElementById("spec");
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const esc = s => s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const lettersOf = s => [...s].filter(ch => /\p{L}/u.test(ch)).join("").toLowerCase();

  let text = "", scene = null, rt = null, fallback = null;

  // Sizes are relative to a standing person (size 1), roughly true to life but nudged up where a
  // real-scale drawing would be too few letters to read. The biggest thing on stage fills the box.
  function actorScale(key) {
    const max = Math.max(...scene.order.map(k => SHAPES[k].size));
    return SHAPES[key].size / max;
  }
  const actOf = A => SHAPES[A.key].actions[A.action];

  const tOf = (start, now) => reduceMotion ? 0.35 : (now - start) / 1000;
  const blendOf = (A, now) => !A.prev || reduceMotion ? 1 : smooth((now - A.transStart) / 1000 / BLEND_SECONDS);
  const sameRig = (a, b) => !!a.rig && a.rig === b.rig;

  // Change what an actor is doing without cutting: remember the old action and blend out of it.
  function setAction(A, action, now) {
    if (A.action === action) return;
    A.prev = { action: A.action, start: A.actionStart };
    A.transStart = now;
    A.action = action; A.actionStart = now;
  }

  // Everyone's action at step i: the latest thing each actor was told to do at or before it.
  function actsAt(i) {
    const eff = {};
    for (let j = 0; j <= i; j++) Object.assign(eff, scene.steps[j].acts);
    return eff;
  }

  function enterStep(i, now) {
    rt.step = i; rt.stepStart = now;
    const st = scene.steps[i];
    rt.chase = st.chase;
    const fresh = [];
    for (const [key, a] of Object.entries(actsAt(i))) {
      let A = rt.actors[key];
      if (!A) {
        A = rt.actors[key] = { key, sx: 0, born: now, action: a.action, actionStart: now, prev: null, phase: 0, vel: SHAPES[key].actions[a.action].speed || 0 };
        fresh.push(A);
      } else setAction(A, a.action, now);
      A.letters = lettersOf(scene.nounWords[key] + a.word);
    }
    // place newcomers so they don't land on top of anyone
    const others = Object.values(rt.actors).filter(o => !fresh.includes(o));
    if (!others.length && fresh.length > 1) {
      const slots = fresh.length === 2 ? [60, 140] : [40, 100, 160];
      fresh.forEach((A, j) => A.sx = slots[j]);
    } else {
      for (const A of fresh) {
        if (!others.length) { A.sx = (actOf(A).speed || 0) > 0 ? 55 : 100; others.push(A); continue; }
        let best = 100, bestD = -1;
        for (const x of [45, 100, 150]) { const d = Math.min(...others.map(o => Math.abs(o.sx - x))); if (d > bestD) { bestD = d; best = x; } }
        A.sx = best; others.push(A);
      }
    }
    if (st.chase) {
      const f = rt.actors[st.chase.from], to = rt.actors[st.chase.to];
      if (f && to) {
        if (fresh.includes(f) && fresh.includes(to)) { f.sx = 40; to.sx = 125; }
        else if (fresh.includes(f)) f.sx = Math.max(25, to.sx - 70);
        else if (fresh.includes(to)) to.sx = Math.min(LIMIT_R, f.sx + 70);
      }
    }
    renderStatus(); renderChips();
  }

  // A new reading of the sentence. Keep everyone already on stage and pick up at the first step that changed.
  function applyScene(next, now) {
    const old = scene;
    scene = next;
    if (!rt) { rt = { actors: {}, step: 0, stepStart: now, ground: 0, chase: null }; enterStep(0, now); return; }
    for (const k of Object.keys(rt.actors)) if (!next.order.includes(k)) delete rt.actors[k];
    const n = next.steps.length, sig = st => JSON.stringify(st);
    let i = 0;
    if (old) while (i < n && i < old.steps.length && sig(old.steps[i]) === sig(next.steps[i])) i++;
    if (i >= n) i = Math.min(rt.step, n - 1);
    enterStep(i, now);
  }

  function update(now, dt) {
    if (!rt) return;
    const n = scene.steps.length;
    if (n > 1 && (now - rt.stepStart) / 1000 > (rt.step === n - 1 ? STEP_SECONDS + HOLD_SECONDS : STEP_SECONDS)) {
      enterStep((rt.step + 1) % n, now);       // loop back to the start, blending as usual
    }
    if (reduceMotion) return;
    const list = Object.values(rt.actors);
    for (const A of list) {
      const act = actOf(A), k = blendOf(A, now);
      // gait phase: cadence eases from the old action's to the new one's, so strides speed up rather than restart
      const prev = A.prev && k < 1 ? SHAPES[A.key].actions[A.prev.action] : null;
      const freq = prev && sameRig(prev, act) ? (prev.freq || 0) + ((act.freq || 0) - (prev.freq || 0)) * k : act.freq || 0;
      A.phase += dt * TAU * freq;
      let v = act.speed || 0;
      if (rt.chase && A.key === rt.chase.from && rt.actors[rt.chase.to] && v > 0) {
        const T = rt.actors[rt.chase.to], vt = actOf(T).speed || 0;
        v = T.sx - A.sx > 72 ? Math.max(v, vt * 1.3 + 6) : vt;   // close the gap, then keep pace
      }
      A.vel += (v - A.vel) * (1 - Math.exp(-dt * (v < A.vel ? 3.5 : 2.2)));   // momentum: speed up gradually, brake a little faster
    }
    // Movers walk across the screen until LIMIT_R; past that, the world (ground and anything standing still) scrolls instead.
    let shift = 0;
    for (const A of list) if (A.vel > 0.5 && !SHAPES[A.key].sky) shift = Math.max(shift, A.sx + A.vel * dt - LIMIT_R);
    for (const A of list) {
      if (SHAPES[A.key].sky) continue;
      if (A.vel > 0.5) A.sx = Math.max(LIMIT_L, A.sx + A.vel * dt - shift);
      else { A.sx -= shift; if (A.sx < -45) A.sx += STAGE_W + 90; }
    }
    rt.ground += shift;
  }

  // ---------- drawing one actor ----------
  function placeActor(c, A, act) {
    const sh = SHAPES[A.key], sc = actorScale(A.key);
    if (sh.sky) c.translate(A.sx - 50 * sc, 2);
    else c.translate(A.sx - 50 * sc, GROUND * (1 - sc) - (act.lift ? act.lift * (1 - sc) + (scene.order.length > 1 ? 20 : 0) : 0));
    c.scale(sc, sc);
  }
  // The current action. If the previous one shares a skeleton, blend the two poses.
  function drawActor(c, A, now) {
    const act = actOf(A), t = tOf(A.actionStart, now), k = blendOf(A, now);
    const prev = A.prev && k < 1 ? SHAPES[A.key].actions[A.prev.action] : null;
    placeActor(c, A, act);
    if (!act.rig) { act.draw(c, t); return; }
    let P = act.pose(A.phase, t);
    if (prev && sameRig(prev, act)) {
      const tp = tOf(A.prev.start, now);
      P = lerpPose(prev.pose(A.phase, tp), P, k);
      if (prev.extra) prev.extra(c, tp, 1 - k);
      if (act.extra) act.extra(c, t, k);
    } else if (act.extra) act.extra(c, t, 1);
    RIGS[act.rig](c, P, A.phase);
  }
  // The outgoing action, drawn on its own so its letters can dissolve into the new shape.
  const needsGhost = (A, now) => !!A.prev && blendOf(A, now) < 1 && !sameRig(SHAPES[A.key].actions[A.prev.action], actOf(A));
  function drawGhost(c, A, now) {
    const act = SHAPES[A.key].actions[A.prev.action], t = tOf(A.prev.start, now);
    placeActor(c, A, act);
    if (!act.rig) { act.draw(c, t); return; }
    if (act.extra) act.extra(c, t, 1);
    RIGS[act.rig](c, act.pose(A.phase, t), A.phase);
  }
  function coverage(L) {
    const data = L.c.getImageData(0, 0, L.cv.width, L.cv.height).data, w = L.cv.width;
    for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
      let sum = 0;
      for (let y = 0; y < SY; y += 2) for (let x = 0; x < SX; x += 2) sum += data[((r * SY + y) * w + col * SX + x) * 4 + 3];
      L.cov[r * COLS + col] = sum / (255 * (SY / 2) * (SX / 2));
    }
  }
  // Outline mode for small things: catch thin strokes that cover only part of a cell,
  // then keep just the cells on the edge so the shape reads as a line drawing instead of a blob.
  const onCells = new Uint8Array(COLS * ROWS);
  let drawingSmall = false;                  // true while drawing a thing small enough for its icon version
  function outline(cov) {
    for (let j = 0; j < cov.length; j++) onCells[j] = cov[j] >= 0.12 ? 1 : 0;
    for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
      const j = r * COLS + col;
      if (!onCells[j]) { cov[j] = 0; continue; }
      const edge = col === 0 || col === COLS - 1 || r === 0 || r === ROWS - 1 ||
        !onCells[j - 1] || !onCells[j + 1] || !onCells[j - COLS] || !onCells[j + COLS];
      cov[j] = edge ? 0.8 : 0;
    }
  }

  function beginLayer(L) {
    const { c } = L;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, L.cv.width, L.cv.height);
    c.setTransform(UNIT, 0, 0, UNIT, 0, 0);
    c.fillStyle = "#000"; c.strokeStyle = "#000"; c.lineCap = "round"; c.lineJoin = "round";
  }

  // ---------- status and chips ----------
  function describe(st) {
    if (st.chase) {
      const rest = Object.entries(st.acts).filter(([k]) => k !== st.chase.from && k !== st.chase.to)
        .map(([k, a]) => `${scene.nounWords[k]} ${SHAPES[k].actions[a.action].label}`);
      return [`${scene.nounWords[st.chase.from]} chasing ${scene.nounWords[st.chase.to]}`, ...rest].join(", ");
    }
    return Object.entries(st.acts).map(([k, a]) => `${scene.nounWords[k]} ${SHAPES[k].actions[a.action].label}`).join(", ");
  }
  function renderStatus() {
    if (!scene) {
      statusEl.innerHTML = text ? `No drawing for <b>${esc(text)}</b> yet, so it spells itself out` : "Type a thing and what it does. It moves as soon as it recognises a word.";
      return;
    }
    let html;
    if (scene.steps.length === 1) html = `<b>${esc(text)}</b> → ${esc(describe(scene.steps[0]))}`;
    else html = scene.steps.map((st, i) => i === rt.step ? `<b class="now">${esc(describe(st))}</b>` : esc(describe(st))).join(" → ");
    if (!scene.hasVerb && !scene.notes.length) html += `. Add an action to change how it moves.`;
    if (scene.notes.length) html += `<span class="note"> · ${esc(scene.notes.join(", "))}</span>`;
    statusEl.innerHTML = html;
  }
  const articleFor = n => ["me", "you", "he", "she", "i", "people", "men", "women", "love", "sunshine"].includes(n) ? "" : /^[aeiou]/.test(n) ? "an " : "a ";

  function renderChips() {
    const key = scene ? scene.order[0] : null;
    for (const b of chipsEl.children) b.setAttribute("aria-pressed", String(!!scene && scene.order.includes(b.dataset.key)));
    verbsEl.replaceChildren();
    if (!key) { const s = document.createElement("span"); s.className = "row-label"; s.style.flexBasis = "auto"; s.textContent = "pick a thing first"; verbsEl.appendChild(s); return; }
    const sh = SHAPES[key], noun = scene.nounWords[key], A = rt && rt.actors[key];
    for (const [ak, act] of Object.entries(sh.actions)) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = act.verb; b.setAttribute("aria-pressed", String(!!A && A.action === ak));
      b.title = scene.hasVerb ? `Add “then ${act.verb}” to the scene` : `Make the ${noun} ${act.verb.replace(/e?s$/, "")}`;
      b.addEventListener("click", () => {
        // With a verb already typed, an action chains on; otherwise it becomes the first action.
        const v = scene.hasVerb ? `${input.value.trim().replace(/[,\s]+$/, "")}, then ${act.verb}` : `${articleFor(noun)}${noun} ${act.verb}`;
        input.value = v; live(v, true);
      });
      verbsEl.appendChild(b);
    }
  }

  // Words that are still being typed: "ca" could become "cat" or "catch", so wait before acting on them.
  const KNOWN = [...Object.keys(LOOKUP), ...Object.keys(VERBS), "then", "with"];
  const meaning = w => nounOf(w) ? "n:" + nounOf(w) : VERBS[w] ? "v:" + VERBS[w] : w === "then" || w === "with" ? w : null;
  function settled(raw) {
    const m = raw.match(/(\p{L}+)$/u);
    if (!m) return raw;
    const w = m[1].toLowerCase(), mw = meaning(w);
    return KNOWN.some(k => k.length > w.length && k.startsWith(w) && meaning(k) !== mw) ? raw.slice(0, -m[1].length) : raw;
  }

  // Called on every keystroke. Nothing restarts: the scene only changes where the meaning changed.
  let lastSig = null;
  function live(raw, final) {
    text = raw.trim().replace(/\s+/g, " ");
    const now = performance.now();
    const next = buildScene(final ? text : settled(raw).trim());
    const sig = next ? JSON.stringify([next.steps, next.order, next.nounWords]) : "";
    if (next && sig !== lastSig) { fallback = null; applyScene(next, now); }
    else if (!next) {
      rt = null; scene = null;
      if (lettersOf(text)) { if (!fallback) fallback = { born: now }; fallback.letters = lettersOf(text); }
      else fallback = null;
      renderStatus(); renderChips();
    } else renderStatus();
    lastSig = sig;
    if (final) try { history.replaceState(null, "", text ? "#" + text.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "") : location.pathname); } catch (e) {}
  }

  // ---------- frame ----------
  let last = performance.now();
  const startT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    readColors(now);
    update(now, dt);

    // 1. draw each actor's silhouette into its own mask layer, and 2. measure how much of each cell it covers.
    //    While an action dissolves into one with a different skeleton, mix the old silhouette's coverage in.
    const actors = rt ? scene.order.map(k => rt.actors[k]).filter(Boolean) : [];
    const nLayers = rt ? actors.length : fallback ? 1 : 0;
    for (let i = 0; i < nLayers; i++) {
      const L = layers[i];
      beginLayer(L);
      L.c.save();
      drawingSmall = !!rt && actorScale(actors[i].key) < OUTLINE_BELOW;
      if (rt) drawActor(L.c, actors[i], now);
      else drawWord(L.c, tOf(startT, now), text.length <= 14 ? text : fallback.letters.slice(0, 14));
      L.c.restore();
      coverage(L);
      if (rt && needsGhost(actors[i], now)) {
        const G = ghosts[i], k = blendOf(actors[i], now);
        beginLayer(G); G.c.save(); drawGhost(G.c, actors[i], now); G.c.restore(); coverage(G);
        for (let j = 0; j < L.cov.length; j++) L.cov[j] = L.cov[j] * k + G.cov[j] * (1 - k);
      }
      if (drawingSmall) outline(L.cov);
    }

    // 3. set the letters. Each cell belongs to whichever layer covers it most (or the ground);
    //    each horizontal run spells its owner's words from the start.
    ctx.clearRect(0, 0, W, H);
    ctx.textBaseline = "top";
    const rect = input.getBoundingClientRect();
    const fromX = rect.left + 24, fromY = rect.top;
    const groundLetters = rt ? lettersOf(text) : "";
    const heavy = [], light = [], dots = [];
    let count = 0;
    for (let r = 0; r < ROWS; r++) {
      let k = 0, prevOwner = -2;
      for (let col = 0; col < COLS; col++) {
        const id = r * COLS + col;
        let owner = -2, v = 0;
        for (let i = 0; i < nLayers; i++) { const cv = layers[i].cov[id]; if (cv >= 0.3 && cv > v) { v = cv; owner = i; } }
        if (owner === -2 && rt && r === ROWS - 1 && ((col * STAGE_W / COLS + rt.ground) % GAP_EVERY + GAP_EVERY) % GAP_EVERY >= GAP) { owner = -1; v = 0.5; }
        let x = ox + col * cellW, y = oy + r * fs;
        if (owner === -2) { prevOwner = -2; dots.push(x, y); continue; }
        if (owner !== prevOwner) k = 0;
        prevOwner = owner;
        const word = owner === -1 ? groundLetters : rt ? actors[owner].letters : fallback.letters;
        const ch = word[k % word.length]; k++; count++;
        const born = owner === -1 ? -1e9 : rt ? actors[owner].born : fallback.born;
        const age = (now - born) / 1000;
        if (!reduceMotion && age < 1.6) {
          const d = hash(id) * 0.6, q = clamp((age - d) / 0.9), e = 1 - Math.pow(1 - q, 3);
          const sx = fromX + (hash(id + 7) - 0.5) * 120, sy = fromY + (hash(id + 3) - 0.5) * 30;
          x = sx + (x - sx) * e; y = sy + (y - sy) * e;
        }
        (v >= 0.72 ? heavy : light).push(x, y, ch);
      }
    }

    ctx.font = `400 ${fs}px "JetBrains Mono", monospace`;
    ctx.fillStyle = colors.grid;
    for (let i = 0; i < dots.length; i += 2) ctx.fillText("·", dots[i], dots[i + 1]);
    ctx.fillStyle = colors.soft;
    for (let i = 0; i < light.length; i += 3) ctx.fillText(light[i + 2], light[i], light[i + 1]);
    ctx.font = `700 ${fs}px "JetBrains Mono", monospace`;
    ctx.fillStyle = colors.ink;
    for (let i = 0; i < heavy.length; i += 3) ctx.fillText(heavy[i + 2].toUpperCase(), heavy[i], heavy[i + 1]);

    specEl.textContent = `${COLS} × ${ROWS} cells · ${count} letters` + (scene && scene.steps.length > 1 ? ` · scene ${rt.step + 1}/${scene.steps.length}` : "");
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  let timer = 0;
  input.addEventListener("input", () => { live(input.value, false); clearTimeout(timer); timer = setTimeout(() => live(input.value, true), 450); });
  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); clearTimeout(timer); live(input.value, true); });
  document.addEventListener("keydown", e => {
    if (document.activeElement !== input && e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey && document.activeElement.tagName !== "BUTTON") input.focus();
  });
  for (const key of Object.keys(SHAPES)) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = key; b.dataset.key = key; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => { const v = `${articleFor(key)}${key}`; input.value = v; live(v, true); });
    chipsEl.appendChild(b);
  }
  for (const ex of ["a man walks, then runs, then jumps", "a man runs, trips and falls, then gets up", "a man walks and then he stops", "a cat chases a bird", "a man walks with a cat", "the sun rises, then a bird flies", "a man jumps, then dances, then sleeps"]) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = ex;
    b.addEventListener("click", () => { input.value = ex; live(ex, true); });
    examplesEl.appendChild(b);
  }

  addEventListener("resize", layout);
  const first = location.hash.slice(1).replace(/-/g, " ").toLowerCase() || "a man walks, then runs, then jumps";
  input.value = first;
  const go = () => { layout(); live(first, true); requestAnimationFrame(frame); };
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load('400 16px "JetBrains Mono"'), document.fonts.load('700 16px "JetBrains Mono"')]).catch(() => {}) : Promise.resolve()).then(go);
})();
</script>
</body>
</html>
