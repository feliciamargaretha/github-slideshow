html,body{margin:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
text{font-family:Mynerve;fill:#FFD60A}
#t1{font-size:54px}
#t2{font-size:16px}
</style></head><body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <filter id="pen" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
  <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="wob"/>
  <feDisplacementMap in="SourceGraphic" in2="wob" scale="3" xChannelSelector="R" yChannelSelector="G" result="ink"/>
  <feGaussianBlur in="ink" stdDeviation="5" result="b1"/>
  <feOffset in="b1" dy="3" result="o1"/>
  <feFlood flood-color="#000" flood-opacity="0.85"/><feComposite in2="o1" operator="in" result="sh1"/>
  <feGaussianBlur in="ink" stdDeviation="1.2" result="b2"/>
  <feFlood flood-color="#000" flood-opacity="0.7"/><feComposite in2="b2" operator="in" result="sh2"/>
  <feMerge><feMergeNode in="sh1"/><feMergeNode in="sh2"/><feMergeNode in="ink"/></feMerge>
 </filter>
 <filter id="small" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
  <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b1"/><feOffset in="b1" dy="1" result="o1"/>
  <feFlood flood-color="#000" flood-opacity="0.9"/><feComposite in2="o1" operator="in" result="sh1"/>
  <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="d"/><feGaussianBlur in="d" stdDeviation="0.6" result="b2"/>
  <feFlood flood-color="#000" flood-opacity="0.8"/><feComposite in2="b2" operator="in" result="sh2"/>
  <feMerge><feMergeNode in="sh1"/><feMergeNode in="sh2"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <clipPath id="c1"><rect id="r1" x="0" y="0" height="1080" width="0"/></clipPath>
</defs>
<g filter="url(#pen)">
 <g clip-path="url(#c1)"><text id="t1" x="960" y="880" text-anchor="middle">50% of unicorn founders had previously worked at a startup*</text></g>
</g>
<g filter="url(#small)"><text id="t2" x="1880" y="1040" text-anchor="end">Source: Endeavor Insight (2023), Where Do Unicorns Come From?</text></g>
</svg>
<script>
const cl=v=>Math.max(0,Math.min(1,v)), seg=(t,a,b)=>cl((t-a)/(b-a)), eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const t1=document.getElementById('t1'),t2=document.getElementById('t2'),r1=document.getElementById('r1');
let b1;
window.renderAt=t=>{
  b1=b1||t1.getBBox();
  r1.setAttribute('x',b1.x-20); r1.setAttribute('width',(b1.width+40)*eio(seg(t,0,1.1)));
  const p=seg(t,0.9,1.4); t2.style.opacity=p; t2.setAttribute('transform',`translate(0 ${(1-p)*6})`);
};
document.fonts.ready.then(()=>window.renderAt(0));
</script></body></html>
