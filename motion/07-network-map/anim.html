<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mynerve;src:url(Mynerve.ttf) format("truetype");}
html,body{margin:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
text{font-family:Mynerve;font-size:23px;fill:#fff}
</style></head><body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <filter id="pen" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
  <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="wob"/>
  <feDisplacementMap in="SourceGraphic" in2="wob" scale="3" xChannelSelector="R" yChannelSelector="G" result="ink"/>
  <feGaussianBlur in="ink" stdDeviation="4" result="b1"/><feOffset in="b1" dy="2" result="o1"/>
  <feFlood flood-color="#000" flood-opacity="0.8"/><feComposite in2="o1" operator="in" result="sh1"/>
  <feGaussianBlur in="ink" stdDeviation="1.1" result="b2"/>
  <feFlood flood-color="#000" flood-opacity="0.7"/><feComposite in2="b2" operator="in" result="sh2"/>
  <feMerge><feMergeNode in="sh1"/><feMergeNode in="sh2"/><feMergeNode in="ink"/></feMerge>
 </filter>
</defs>
<g filter="url(#pen)" stroke="#fff" fill="none" stroke-linecap="round">
 <g id="edges" stroke-width="2.5"></g><g id="nodes" stroke-width="3"></g>
</g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg', mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
// band at the bottom of the frame, inside the side margins
const XL=40, XR=1880, YT=720, YB=1064, LR=40;
const N=[];
const fits=(x,y,r)=>x-r>=XL&&x+r<=XR&&y-r>=YT&&y+r<=YB&&N.every(n=>Math.hypot(n.x-x,n.y-y)>=n.r+r+(n.name||r===LR?46:34));
// root: the first person, on the left
N.push({x:92,y:900,r:24,root:true});
// named people spread across the width, alternating high/low
const names=['Mikko','Sanni','Aino','Juho','Elina','Lauri','Veera','Otto'];
const ys=[800,990,850,1005,790,960,830,995];
names.forEach((nm,i)=>{const x=290+i*((1810-290)/7)+(rnd()-.5)*60, y=ys[i]+(rnd()-.5)*30; N.push({x:Math.min(XR-LR,x),y,r:LR,name:nm});});
// everyone else: small dots and rings scattered around them
for(let k=0;k<6000&&N.length<54;k++){const r=rnd()<0.5?8:(rnd()<0.6?13:17), x=XL+r+rnd()*(XR-XL-2*r), y=YT+r+rnd()*(YB-YT-2*r); if(fits(x,y,r)) N.push({x,y,r});}
// links: each node to its nearest neighbours (a mesh, not a tree)
const key=(i,j)=>i<j?i+'-'+j:j+'-'+i, ES=new Map();
N.forEach((a,i)=>{const near=N.map((b,j)=>[j,Math.hypot(a.x-b.x,a.y-b.y)]).filter(q=>q[0]!==i).sort((p,q)=>p[1]-q[1]);
  const k=a.root?4:(a.name?4:(rnd()<0.5?2:3)); near.slice(0,k).forEach(([j,d])=>{if(d<330)ES.set(key(i,j),[i,j,d]);});});
// growth time = shortest path distance from the root (a ripple that spreads out)
const adj=N.map(()=>[]); for(const [i,j,d] of ES.values()){adj[i].push([j,d]);adj[j].push([i,d]);}
const dist=N.map(()=>Infinity); dist[0]=0; const done=new Set();
while(done.size<N.length){let u=-1;N.forEach((_,i)=>{if(!done.has(i)&&(u<0||dist[i]<dist[u]))u=i;});
  if(dist[u]===Infinity){ // join a stray cluster to the nearest reached node
    let best=null;N.forEach((a,i)=>{if(done.has(i))N.forEach((b,j)=>{if(!done.has(j)){const d=Math.hypot(a.x-b.x,a.y-b.y);if(!best||d<best[2])best=[i,j,d];}});});
    ES.set(key(best[0],best[1]),best);adj[best[0]].push([best[1],best[2]]);adj[best[1]].push([best[0],best[2]]);dist[best[1]]=dist[best[0]]+best[2];continue;}
  done.add(u); for(const [v,d] of adj[u]) if(dist[u]+d<dist[v]) dist[v]=dist[u]+d;}
const maxD=Math.max(...dist), SPAN=2.6, T0=0.1, tOf=i=>T0+dist[i]/maxD*SPAN;
const nodeEls=N.map((n,i)=>{const g=mk('g',{},document.getElementById('nodes'));
  mk('circle',{r:n.r,fill:n.r<10?'#fff':'none'},g);
  if(n.name){const t=mk('text',{'text-anchor':'middle',y:8,stroke:'none'},g);t.textContent=n.name;}
  return [n,g,tOf(i)];});
const edgeEls=[...ES.values()].map(([i,j])=>{const [a,b]=tOf(i)<=tOf(j)?[i,j]:[j,i];return [N[a],N[b],tOf(a),tOf(b),mk('line',{},document.getElementById('edges'))];});
const cl=v=>Math.max(0,Math.min(1,v)), seg=(t,a,b)=>cl((t-a)/(b-a)), eo=p=>1-Math.pow(1-p,3), eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c1=2.2,c3=c1+1;return p<=0?0:1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function edge(el,a,b,p){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const x1=a.x+ux*a.r, y1=a.y+uy*a.r, x2=b.x-ux*b.r, y2=b.y-uy*b.r;
  el.setAttribute('x1',x1);el.setAttribute('y1',y1);el.setAttribute('x2',x1+(x2-x1)*p);el.setAttribute('y2',y1+(y2-y1)*p);el.style.opacity=p>0?1:0;}
window.renderAt=t=>{
  for(const [n,g,tn] of nodeEls){const p=seg(t,tn,tn+0.3);g.setAttribute('transform',`translate(${n.x} ${n.y}) scale(${back(p)})`);g.style.opacity=p>0?1:0;}
  for(const [a,b,ta,tb,el] of edgeEls){const s=ta+0.05, e=Math.max(tb,s+0.15); edge(el,a,b,eo(seg(t,s,e)));}
};
document.fonts.ready.then(()=>window.renderAt(0));
</script></body></html>
