<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Näsinneula Studies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400&family=Patrick+Hand&display=swap">
<style>
/* Layout: three studies of the same tower side by side, each on its own ground, with a caption under it. */
:root {
  --paper: #ffffff; --ink: #141414; --soft: #55585e;
  --blue: #1d4fae; --pen: #2457d6; --cream: #fbf7ea; --sun: #f3d43b; --mono-bg: #fbf8ec;
  --f-display: "Newsreader", Georgia, serif; --f-body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace; --f-hand: "Patrick Hand", "Comic Neue", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 400 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 56px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { margin: 0 0 8px; font: 400 clamp(2.2rem, 4.4vw, 3.6rem)/1.05 var(--f-display); letter-spacing: -.02em; }
.intro { margin: 0 0 40px; max-width: 56ch; color: var(--soft); }
.studies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.study { margin: 0; display: grid; grid-template-rows: auto auto; gap: 16px; min-width: 0; }
.ground { position: relative; display: grid; place-items: center; aspect-ratio: 1; overflow: hidden; border: 1px dashed #d9d9de; border-radius: 4px; }
figcaption { display: grid; gap: 4px; }
figcaption b { font: 500 15px/1.3 var(--f-body); }
figcaption span { color: var(--soft); font-size: 14px; }
.label { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }

/* every study sits in the same square, on a transparent ground, at the same height */
.art { display: block; height: 86%; width: auto; max-width: 100%; }
img.art { position: absolute; top: 7%; left: 50%; height: 86%; transform: translateX(-50%); filter: drop-shadow(0 8px 14px rgba(20,20,20,.14)); }
.pen .val, .pen .word { font-family: var(--f-hand); fill: var(--pen); stroke: none; }
.pen .val { font-size: 22px; }
.pen .word { font-size: 21px; letter-spacing: .12em; }

/* 03: ASCII art */
.g3 { display: grid; place-items: center; }
.g3 pre { margin: 0; font: 500 6px/1.02 var(--f-mono); color: var(--blue); letter-spacing: .02em; white-space: pre; }

@media (max-width: 980px) { .studies { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) {
  .studies { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<script>
  // size the ASCII so its 64 columns fill the card
  const pre = document.querySelector(".g3 pre");
  const fitAscii = () => {
    // same height as the other two (86% of the square)
    const rows = pre.textContent.split("\n").length;
    pre.style.fontSize = (pre.parentElement.clientHeight * .86 / (rows * 1.02)).toFixed(2) + "px";
  };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitAscii);
  addEventListener("resize", fitAscii);
</script>
